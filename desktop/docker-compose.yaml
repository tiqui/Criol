services:
    criol:
        image: ghcr.io/tiqui/criol:latest
        container_name: criol
        restart: unless-stopped
        ports:
            - 9180:9180
        environment:
            # Opcional: deixa um servidor já preenchido no primeiro acesso.
            - CRIOL_SERVER_URL=
            - CRIOL_SERVER_TYPE=navidrome # navidrome, subsonic ou jellyfin
            - CRIOL_SERVER_NAME=
            - CRIOL_SERVER_LOCK=false # true: só deixa usar esse servidor
